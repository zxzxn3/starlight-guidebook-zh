<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starlight Guidebook</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html">Starlight Guidebook</a></div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索已翻译内容" autocomplete="off">
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>

  <main class="home">
    <h1>Starlight Guidebook</h1>

    {% from "_guide_tree.html" import render_guide_tree %}
    {{ render_guide_tree(guide_tree) }}

    <p class="build-note">基于 Starlight {{ version }} 的本地 Guidebook。</p>
  </main>
  <script>window.SEARCH_ROOT = "";</script>
  <script src="assets/search.js"></script>
</body>
</html>
